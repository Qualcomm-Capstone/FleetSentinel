plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

// Kafka uses the maintained LZ4 fork; ClickHouse still requests the original coordinates.
// Both provide org.lz4:lz4-java, so keep one implementation on the runtime classpath.
configurations.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
        selectHighestVersion()
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'com.clickhouse:clickhouse-jdbc:0.9.0:all'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    exclude '**/*IT.class'
}

tasks.register('integrationTest', Test) {
    description = 'Tests ClickHouse queries against an empty, disposable database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    outputs.upToDateWhen { false }
    def databaseUrl = providers.gradleProperty('clickhouseTestUrl').orElse('')
    systemProperty 'clickhouse.test.url', databaseUrl.get()
    systemProperty 'clickhouse.test.schema', rootProject.file('infra/clickhouse/001-schema.sql').absolutePath
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}
