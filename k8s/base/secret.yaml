# ⚠️ 개발용 평문이다. 운영에서는 External Secrets Operator / Sealed Secrets 로 바꾼다.
#    게이트웨이가 오브젝트 스토리지 자격증명을 갖는 구조 자체가 위험이다 —
#    운영에서는 IAM 역할을 PutObject + 접두사로 최소화해야 한다(SDD L-7).
apiVersion: v1
kind: Secret
metadata:
  name: fleet-secrets
  namespace: fleetsentinel
type: Opaque
stringData:
  MINIO_ACCESS_KEY: admin
  MINIO_SECRET_KEY: password
  CLICKHOUSE_USER: fleet
  CLICKHOUSE_PASSWORD: fleet
  CLIP_DB_USERNAME: fleet
  CLIP_DB_PASSWORD: fleet-local
