syntax = "proto3";

package fleetsentinel.ingest.v1;

option java_package = "io.fleetsentinel.gateway.proto";
option java_outer_classname = "IngestProto";
option java_multiple_files = true;

// 차량 → 수집 게이트웨이 업링크.
//
// 신원은 이 메시지에 없다. `vehicle_id`는 클라이언트 인증서 SAN URI에서만 나오고
// (SDD S-9), 차량이 메타데이터 `x-vehicle-id`로 보낸 값은 대조용 "주장"일 뿐이다.
// 불일치하면 PERMISSION_DENIED로 스트림이 끊긴다.
service Ingest {
  // 양방향 스트림. 차량이 레코드를 밀고, 게이트웨이가 CACK을 돌려준다.
  //
  // 요구 메타데이터:
  //   x-vehicle-id : 차량이 주장하는 ID. 인증서와 대조된다
  //   x-boot-id    : 이 스트림을 여는 WAL 세션의 boot_id (ULID)
  rpc Stream(stream IngestRecord) returns (stream Ack);
}

message IngestRecord {
  // 차량별 단조 증가. WAL이 발급한다. 결번이 곧 유실이다.
  uint64 seq = 1;

  // WAL 프레임의 kind 바이트와는 값이 다르다. proto3는 enum 0을 UNSPECIFIED로
  // 예약하므로 정렬시킬 수 없다. WAL의 온디스크 포맷은 이미 검증된 계약이라
  // 기존 값을 유지하고 클라이언트가 한 곳에서 매핑한다
  // — fleetsentinel_ingest/grpc_transport.py 의 _KIND_TO_WIRE.
  //
  //   WAL 0 (SIGNAL)      → RECORD_KIND_SIGNAL      (1)
  //   WAL 1 (SEGMENT_REF) → RECORD_KIND_SEGMENT_REF (2)
  //   WAL 2 (PERCEPTION)  → RECORD_KIND_PERCEPTION  (3)
  RecordKind kind = 2;

  // Avro 인코딩된 레코드 본문. 게이트웨이는 열어보지 않는다 —
  // 스키마에 결합되지 않아야 새 채널 추가가 게이트웨이 배포를 요구하지 않는다.
  bytes payload = 3;
}

enum RecordKind {
  // proto3 필수 zero value. 명시하지 않은 레코드는 거절된다.
  RECORD_KIND_UNSPECIFIED = 0;
  RECORD_KIND_SIGNAL = 1;
  RECORD_KIND_SEGMENT_REF = 2;
  RECORD_KIND_PERCEPTION = 3;
}

message Ack {
  // 이 값 이하 seq는 전부 Kafka 쓰기(acks=all)가 성공했다.
  // 차량은 여기까지 WAL을 커밋해도 안전하다.
  uint64 ack_seq = 1;
}

// ── 중량 경로 제어 평면 ────────────────────────────────────────────────
//
// 원시 센서 클립(MCAP, 298~341 MiB)은 **이 채널로 흐르지 않는다.** 게이트웨이는
// presigned URL만 발급하고 데이터는 차량 → 오브젝트 스토리지로 직행한다.
// 게이트웨이를 데이터 경로에 넣으면 100대에서
// 2.5 GiB/s가 통과해 stateless 확장 이점이 사라진다.
//
// **REST가 아니라 gRPC인 이유** — 이 채널은 이미 mTLS로 종단되고
// PeerIdentityInterceptor 가 vehicle_id 를 인증서에서 확정한다. 별도 HTTPS
// 엔드포인트를 두면 인증 경로가 둘이 되고 언젠가 어긋난다.
service SegmentUpload {
  // 업로드를 시작한다. 게이트웨이가 segment_id 를 발급하고
  // 이 차량의 경로로만 유효한 파트별 presigned URL 을 돌려준다.
  rpc Begin(BeginUploadRequest) returns (BeginUploadResponse);

  // 모든 파트를 올린 뒤 호출한다. 게이트웨이가 multipart 를 완료하고
  // sha256 을 대조한다 — 차량에 맡기지 않는다.
  rpc Complete(CompleteUploadRequest) returns (CompleteUploadResponse);

  // 진행 중인 업로드의 presigned URL 을 다시 서명한다.
  //
  // URL 만료는 15분인데 재연결까지 그보다 오래 걸릴 수 있다. 게이트웨이가 상태를
  // 갖지 않으므로(§4.1) "어디까지 올렸는지"는 차량과 스토리지가 알고 있고,
  // 게이트웨이는 같은 upload_id 로 서명만 새로 해준다.
  rpc Refresh(RefreshUrlsRequest) returns (BeginUploadResponse);

  // 포기한다. 남은 파트를 지워 스토리지 요금이 새지 않게 한다.
  rpc Abort(AbortUploadRequest) returns (AbortUploadResponse);
}

message BeginUploadRequest {
  // 클립의 시간 범위. `date=` 파티션은 t_start 의 UTC 날짜로 정해진다
  // — 업로드 시각이 아니다(§3).
  int64 t_start_us = 1;
  int64 t_end_us = 2;

  uint64 size_bytes = 3;

  // MCAP 전체의 sha256(hex). 완료 시 게이트웨이가 대조한다.
  // multipart ETag 는 MD5-of-MD5 라 콘텐츠 해시가 아니다(§4.3).
  string sha256 = 4;

  // 파트 크기. 게이트웨이가 이 값으로 파트 수를 계산해 URL을 발급한다.
  uint64 part_size_bytes = 5;

  // 아래는 segment-ref 메타데이터로 그대로 실린다.
  string scene_id = 6;
  repeated string sensor_channels = 7;
  uint32 sample_count = 8;
}

message BeginUploadResponse {
  string segment_id = 1;          // ULID. 파일명이자 blob 의 정체
  string upload_id = 2;           // multipart upload id
  string blob_uri = 3;            // s3://bucket/key — 완료 후 확정될 위치
  repeated PartUrl part_urls = 4;
  int64 expires_at_us = 5;        // URL 만료 시각
}

message PartUrl {
  uint32 part_number = 1;         // 1부터 시작 (S3 규약)
  string url = 2;
}

message CompleteUploadRequest {
  string segment_id = 1;
  string upload_id = 2;
  repeated PartEtag parts = 3;
  // Begin 과 같은 값. 게이트웨이가 키를 **재구성**하는 데 쓴다 — 키 자체를 받지 않는
  // 이유는 받으면 남의 경로를 완료시킬 수 있기 때문이다. vehicle_id 는 인증서에서
  // 오므로 이 값이 틀려도 남의 접두사로 넘어갈 수 없다.
  int64 t_start_us = 4;
}

message PartEtag {
  uint32 part_number = 1;
  string etag = 2;
}

message CompleteUploadResponse {
  string blob_uri = 1;
  uint64 size_bytes = 2;
  // 게이트웨이가 객체를 다시 읽어 sha256 을 대조한 결과.
  // false 면 객체는 이미 삭제됐고 차량은 재업로드해야 한다.
  bool verified = 3;
}

message RefreshUrlsRequest {
  string segment_id = 1;
  string upload_id = 2;
  // 아직 못 올린 파트 번호만.
  repeated uint32 part_numbers = 3;
  int64 t_start_us = 4;
}

message AbortUploadRequest {
  string segment_id = 1;
  string upload_id = 2;
  int64 t_start_us = 3;
}

message AbortUploadResponse {
  bool aborted = 1;
}
