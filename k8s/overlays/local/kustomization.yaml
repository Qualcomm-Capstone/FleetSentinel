# kind / minikube 용. 저장소 크기를 줄이고 인증서별 게이트웨이는 각각 1대를 유지한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleetsentinel
resources:
  - ../../base
patches:
  # PVC 축소. 로컬 디스크가 원시 클립 50 GiB 를 감당하지 못한다.
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: StatefulSet
      name: kafka
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: StatefulSet
      name: clickhouse
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
