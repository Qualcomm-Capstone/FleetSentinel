apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: fleetsentinel
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: kafka
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          env:
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '0@kafka-0.kafka:9093'}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1'}
            - {name: KAFKA_HEAP_OPTS, value: '-Xms256m -Xmx384m'}
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: fleetsentinel
spec:
  template:
    spec:
      containers:
        - name: topics
          command:
            - /bin/sh
            - -c
            - |
              set -e
              KT="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-0.kafka:9092"
              until $KT --list >/dev/null 2>&1; do sleep 2; done
              for topic in telemetry.records telemetry.dlq fleet.alerts; do
                $KT --create --if-not-exists --topic "$topic" --partitions 1 \
                  --replication-factor 1 --config min.insync.replicas=1 \
                  --config unclean.leader.election.enable=false
              done
