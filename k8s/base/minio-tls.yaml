apiVersion: v1
kind: Service
metadata:
  name: minio-tls
spec:
  selector: {app: minio-tls}
  ports:
    - {name: https, port: 9443, targetPort: https}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-tls
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio-tls}
  template:
    metadata:
      labels: {app: minio-tls}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine
          ports:
            - {name: https, containerPort: 9443}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: https, scheme: HTTPS}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: pki, mountPath: /pki/server, readOnly: true}
      volumes:
        - name: config
          configMap: {name: minio-tls-config}
        - name: pki
          secret:
            secretName: object-server-pki
            defaultMode: 256
            items:
              - {key: tls.crt, path: server.crt}
              - {key: tls.key, path: server.key}
