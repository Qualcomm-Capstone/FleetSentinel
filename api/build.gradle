plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

// Kafka uses the maintained LZ4 fork; ClickHouse still requests the original coordinates.
// Both provide org.lz4:lz4-java, so keep one implementation on the runtime classpath.
configurations.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
        selectHighestVersion()
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'com.clickhouse:clickhouse-jdbc:0.9.0:all'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
    enabled = false
}
