apiVersion: v1
kind: Service
metadata:
  name: mqtt
spec:
  selector: {app: mqtt}
  ports:
    - {name: mqtts, port: 8883, targetPort: mqtts}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mqtt
spec:
  serviceName: mqtt
  replicas: 1
  selector:
    matchLabels: {app: mqtt}
  template:
    metadata:
      labels: {app: mqtt}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1883, runAsGroup: 1883, fsGroup: 1883}
      containers:
        - name: mqtt
          image: eclipse-mosquitto:2.0.22
          ports:
            - {name: mqtts, containerPort: 8883}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: mqtts}
          livenessProbe:
            tcpSocket: {port: mqtts}
            initialDelaySeconds: 15
          volumeMounts:
            - {name: config, mountPath: /mosquitto/config, readOnly: true}
            - {name: pki, mountPath: /mosquitto/config/pki, readOnly: true}
            - {name: data, mountPath: /mosquitto/data}
      volumes:
        - name: config
          configMap: {name: mqtt-config}
        - name: pki
          secret: {secretName: mqtt-server-pki, defaultMode: 288}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
