# KRaft 3브로커. RF=3 / min.insync.replicas=2 는 토픽 생성 시 지정한다
# (scripts/create-topics.sh — ADR-009).
#
# StatefulSet 인 이유: 브로커 id 가 Pod ordinal 로 고정돼야 재시작 후에도 같은 id 를
# 유지한다. Deployment 로 하면 id 가 흔들려 파티션 리더십이 깨진다.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: fleetsentinel
spec:
  clusterIP: None          # headless — Pod DNS(kafka-0.kafka)가 필요하다
  publishNotReadyAddresses: true # KRaft quorum DNS must exist before broker readiness.
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: fleetsentinel
spec:
  serviceName: kafka
  replicas: 3
  podManagementPolicy: Parallel   # KRaft 쿼럼은 셋이 동시에 떠야 형성된다
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ORDINAL="${HOSTNAME##*-}"
              export KAFKA_NODE_ID="$ORDINAL"
              export KAFKA_ADVERTISED_LISTENERS="INTERNAL://${HOSTNAME}.kafka:9092"
              exec /etc/kafka/docker/run
          env:
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@kafka-0.kafka:9093,1@kafka-1.kafka:9093,2@kafka-2.kafka:9093
            - name: KAFKA_LISTENERS
              value: INTERNAL://:9092,CONTROLLER://:9093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: CLUSTER_ID
              value: fleetsentinel-kraft-01
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# 토픽 부트스트랩. compose 의 create-topics.sh 와 같은 설정이다.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: fleetsentinel
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:4.0.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              KT="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-0.kafka:9092"
              until $KT --list >/dev/null 2>&1; do echo "kafka 대기..."; sleep 5; done
              for t in telemetry.records telemetry.dlq; do
                $KT --create --if-not-exists --topic "$t" --partitions 3 \
                  --replication-factor 3 \
                  --config min.insync.replicas=2 \
                  --config unclean.leader.election.enable=false
              done
              $KT --create --if-not-exists --topic fleet.alerts --partitions 1 \
                --replication-factor 3 \
                --config min.insync.replicas=2 \
                --config unclean.leader.election.enable=false
              $KT --list
