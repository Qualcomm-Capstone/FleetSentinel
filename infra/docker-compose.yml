# FleetSentinel — 로컬 MVP 스택
# Kafka(3-broker KRaft) → Flink(JM+TM) → ClickHouse, MinIO 원시 센서 저장
#
# 호스트 접속 포트:
#   Kafka   localhost:29092 / 29093 / 29094  (EXTERNAL 리스너)
#   Flink   http://localhost:8081            (JobManager REST/UI)
#   MinIO   http://localhost:9001            (콘솔), :9000 (S3 API)

name: fleetsentinel

x-kafka-common: &kafka-common
  image: apache/kafka:4.0.0
  networks: [fleet]
  restart: unless-stopped

x-kafka-env: &kafka-env
  # 로컬 3-broker 검증이 Docker Desktop 전체 메모리를 잠식하지 않게 JVM heap을 봉인한다.
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # 로그 디렉토리를 마운트 볼륨으로 고정 (기본 /tmp/kafka-logs는 임시 → 재생성 시 토픽 유실)
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # HA 복제 기본값 (ADR-009: RF=3 / ISR=2 / acks=all)
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # KRaft 단일 클러스터 공유 ID (모든 노드 동일)
  CLUSTER_ID: fleetsentinel-kraft-0001

services:
  kafka1:
    <<: *kafka-common
    container_name: fleet-kafka1
    hostname: kafka1
    ports:
      - "127.0.0.1:29092:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka2:
    <<: *kafka-common
    container_name: fleet-kafka2
    hostname: kafka2
    ports:
      - "127.0.0.1:29093:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://localhost:29093
    volumes:
      - kafka2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka3:
    <<: *kafka-common
    container_name: fleet-kafka3
    hostname: kafka3
    ports:
      - "127.0.0.1:29094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://localhost:29094
    volumes:
      - kafka3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ---- Object storage (GCS 흉내) ----
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: fleet-minio
    hostname: minio
    networks: [fleet]
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 버킷 부트스트랩, 1회 실행 후 종료
  #   checkpoints — Flink 체크포인트
  #   fleet-raw   — 원시 센서 클립(중량 경로, SDD S-1)
  # ⚠️ entrypoint 는 folded scalar(>) 라 줄바꿈이 공백이 된다. 안에 '#' 를 넣으면
  #    그 뒤가 전부 셸 주석이 되어 버킷 생성이 조용히 건너뛰어진다.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: fleet-minio-init
    networks: [fleet]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin password &&
      mc mb --ignore-existing local/checkpoints &&
      mc mb --ignore-existing local/fleet-raw &&
      echo 'minio buckets ready';
      "
    restart: "no"

  # ---- Flink (JobManager + TaskManager) ----
  jobmanager:
    image: flink:2.0.0-java17
    container_name: fleet-jobmanager
    hostname: jobmanager
    networks: [fleet]
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:9249:9249"
    command: jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # S3 파일시스템 플러그인 활성 (체크포인트 s3://checkpoints/ 용, arch A2)
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-2.0.0.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        state.backend.type: rocksdb
        state.checkpoints.dir: s3://checkpoints/flink
        state.savepoints.dir: s3://checkpoints/savepoints
        state.backend.incremental: true
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: admin
        s3.secret-key: password
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      # Gradle shadowJar 산출물을 읽기 전용으로 마운트한다.
      - ../flink-pipeline/build/libs/flink-pipeline-0.1.0.jar:/jars/fleetsentinel.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  taskmanager:
    image: flink:2.0.0-java17
    container_name: fleet-taskmanager
    hostname: taskmanager
    networks: [fleet]
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    scale: 1
    ports:
      - "127.0.0.1:9250:9249"
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-2.0.0.jar
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 1536m
        taskmanager.numberOfTaskSlots: 4
        state.backend.type: rocksdb
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: admin
        s3.secret-key: password
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

  # ---- 저장·질의 ----
  # ClickHouse LTS. Elasticsearch·Kibana를 대체한다 — 근거는 docs/sdd.md §4.1 A-8.
  # 요약: 지리 인덱스가 필요 없는 규모(수백 행)이고, 자체 대시보드가 Kibana를 대체한다.
  clickhouse:
    image: clickhouse:26.3   # LTS 라인. 이동 태그(:lts) 대신 명시적 핀
    container_name: fleet-clickhouse
    hostname: clickhouse
    networks: [fleet]
    ports:
      - "127.0.0.1:8124:8123"   # HTTP (호스트 8123은 타 프로세스가 점유할 수 있어 8124로)
      - "127.0.0.1:9009:9000"   # 네이티브 프로토콜 (호스트 9000은 MinIO가 점유)
    environment:
      CLICKHOUSE_DB: fleet
      CLICKHOUSE_USER: fleet
      CLICKHOUSE_PASSWORD: fleet
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # Flink 수용 검증에서만 켠다: docker compose --profile validation up -d prometheus-flink
  prometheus-flink:
    profiles: ["validation"]
    image: prom/prometheus:v3.5.0
    container_name: fleet-prometheus-flink
    networks: [fleet]
    ports:
      - "127.0.0.1:19098:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus-flink-compose.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready | grep -qi ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  fleet:
    name: fleet

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  minio-data:
  clickhouse-data:
  flink-checkpoints:
