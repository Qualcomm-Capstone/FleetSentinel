spring:
  application:
    name: fleetsentinel-gateway

  grpc:
    server:
      port: 9090
      ssl:
        enabled: true
        bundle: gateway
        # 클라이언트 인증서를 요구한다. OPTIONAL로 두면 인증서 없는 연결이
        # 인터셉터까지 오고, 거기서 거절하더라도 "설정 하나 풀면 열린다"는 상태가 된다.
        client-auth: REQUIRE
      max-inbound-message-size: 1MB

  ssl:
    bundle:
      pem:
        gateway:
          keystore:
            certificate: "file:${FLEETSENTINEL_PKI:./pki}/server/server.crt"
            private-key: "file:${FLEETSENTINEL_PKI:./pki}/server/server.key"
          truststore:
            # 이 CA가 발급한 인증서만 통과한다. 공개 CA 신뢰 목록은 쓰지 않는다 —
            # 차량 신원은 우리가 발급한 것만 유효하다(SDD S-9).
            certificate: "file:${FLEETSENTINEL_PKI:./pki}/ca/ca.crt"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092,localhost:29093,localhost:29094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # acks=all 콜백이 CACK의 근거다. 이것보다 약하면 ack이 유실을 덮는다.
      acks: all
      properties:
        enable.idempotence: true
        # idempotence가 켜져 있으면 5까지는 Kafka가 시퀀스 번호로 재정렬하므로
        # 파티션 내 순서가 유지된다 — 처리량을 포기하지 않고 CACK을 쓸 수 있다.
        max.in.flight.requests.per.connection: 5
        # 전송 계층 배치. 계약은 레코드 단위로 두고 배치는 여기서 얻는다
        # (docs/sdd.md S-7).
        linger.ms: 20
        batch.size: 65536
        compression.type: lz4
        delivery.timeout.ms: 120000

  # 관리 HTTP. gRPC(9090)와 포트를 나눠 LB가 데이터 경로와 헬스체크를 구분하게 한다.
  main:
    web-application-type: servlet

server:
  # 8081은 Flink JobManager UI가 쓴다(infra/docker-compose.yml). 겹치면 로컬에서
  # 둘 중 하나가 안 뜬다.
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

fleetsentinel:
  # 기본은 AWS 자격증명 체인, 로컬 MinIO는 local 프로필을 사용한다.
  # IAM 역할에는 대상 버킷 접두사의 업로드·검증·정리에 필요한 권한만 부여한다.
  object-store:
    bucket: fleet-raw
    key-prefix: v1
    endpoint: ${MINIO_ENDPOINT:}
    path-style-access: ${OBJECT_STORE_PATH_STYLE_ACCESS:false}
    region: us-east-1
    credentials-mode: ${OBJECT_STORE_CREDENTIALS_MODE:default} # AWS 기본 자격증명 체인(IAM 역할 포함)
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    presign-ttl: 15m                 # 최악 클립 업로드 42초의 20배 여유
    max-parts: 1000

  gateway:
    max-inflight: 4096
    ack:
      every-n: 128
      every: 200ms

logging:
  level:
    io.fleetsentinel.gateway: INFO
