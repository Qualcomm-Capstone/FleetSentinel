# 개발 검증용 단일 DB. 운영에서는 관리형 HA PostgreSQL과 백업/PITR을 사용한다.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fleetsentinel
spec:
  selector: {app: postgres}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fleetsentinel
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: fleetsentinel
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: fleet-secrets, key: CLIP_DB_USERNAME}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: fleet-secrets, key: CLIP_DB_PASSWORD}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fleet", "-d", "fleetsentinel"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
