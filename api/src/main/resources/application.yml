spring:
  application:
    name: fleetsentinel-api

  datasource:
    # ⚠️ FINAL 뷰만 읽는다. _raw 를 직접 질의하면 머지 전 중복이 보인다(SDD L-14).
    url: ${CLICKHOUSE_URL:jdbc:ch://localhost:8124/fleet}
    username: ${CLICKHOUSE_USER:fleet}
    password: ${CLICKHOUSE_PASSWORD:fleet}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29093,localhost:29094}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

fleetsentinel:
  api:
    # SSE 푸시 주기. 기본값은 250ms(4Hz).
    push-interval-ms: 250
    # 한 번에 밀어 넣을 신호 레코드 수 상한. 초당 1,308건이 들어오므로
    # 무제한이면 브라우저가 먼저 무너진다.
    max-records-per-push: 200
  alerts:
    topic: ${ALERT_TOPIC:fleet.alerts}
    # SSE는 서버마다 접속자가 다르므로 API 인스턴스끼리 파티션을 나누면 안 된다.
    # 인스턴스별 그룹으로 같은 저빈도 알림을 모두 읽고 Kafka retention에서 버퍼를 복원한다.
    consumer-group: ${ALERT_CONSUMER_GROUP:fleetsentinel-api-${random.uuid}}
    replay-capacity: ${ALERT_REPLAY_CAPACITY:1000}
    heartbeat-ms: ${ALERT_HEARTBEAT_MS:15000}

logging:
  level:
    io.fleetsentinel.api: INFO
