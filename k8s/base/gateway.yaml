# 수집 게이트웨이. 클립 작업 상태는 공유 PostgreSQL에 보관한다.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: fleetsentinel
spec:
  selector:
    app: gateway
  ports:
    - name: https
      port: 8443
    - name: grpc
      port: 9090
    - name: mgmt
      port: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fleetsentinel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
      instance: primary
  template:
    metadata:
      labels:
        app: gateway
        instance: primary
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: gateway
          image: fleetsentinel/gateway:0.1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: mgmt}
            failureThreshold: 60
            periodSeconds: 5
          ports:
            - name: https
              containerPort: 8443
            - name: grpc
              containerPort: 9090
            - name: mgmt
              containerPort: 8082
          env:
            - name: CLIP_MQTT_URI
              valueFrom:
                configMapKeyRef: {name: fleet-config, key: CLIP_MQTT_URI}
            - name: CLIP_MQTT_CLIENT_ID
              value: clip-service
            - name: MQTT_PKI
              value: /mqtt-pki
            - name: CLIP_DB_URL
              valueFrom:
                configMapKeyRef: {name: fleet-config, key: CLIP_DB_URL}
            - name: CLIP_DB_USERNAME
              valueFrom:
                secretKeyRef: {name: fleet-secrets, key: CLIP_DB_USERNAME}
            - name: CLIP_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: fleet-secrets, key: CLIP_DB_PASSWORD}
            # 이 매니페스트는 함께 배포하는 MinIO를 사용한다.
            - name: OBJECT_STORE_CREDENTIALS_MODE
              value: static
            - name: OBJECT_STORE_PATH_STYLE_ACCESS
              value: "true"
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef: {name: fleet-config, key: KAFKA_BOOTSTRAP}
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: fleet-config, key: MINIO_ENDPOINT}
            - name: OBJECT_STORE_PRESIGN_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: fleet-config, key: OBJECT_STORE_PRESIGN_ENDPOINT}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: fleet-secrets, key: MINIO_ACCESS_KEY}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: fleet-secrets, key: MINIO_SECRET_KEY}
            # mTLS 인증서 경로. Secret 을 여기에 마운트한다.
            - name: FLEETSENTINEL_PKI
              value: /pki
          volumeMounts:
            - name: mqtt-pki
              mountPath: /mqtt-pki
              readOnly: true
            - name: pki
              mountPath: /pki
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: mgmt
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: mqtt-pki
          secret:
            secretName: clip-service-pki
            defaultMode: 288
        - name: pki
          secret:
            secretName: gateway-pki
            # Secret 키 이름을 게이트웨이가 기대하는 경로 구조로 편다.
            items:
              - key: ca.crt
                path: ca/ca.crt
              - key: server.crt
                path: server/server.crt
              - key: server.key
                path: server/server.key
---
