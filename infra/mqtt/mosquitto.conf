# Local, single-node validation only. This is not a cloud HA deployment.
listener 8883
allow_anonymous false
retain_available false
require_certificate true
use_identity_as_username true
# Bind session identity to certificate CN, not a client-supplied clientId.
use_username_as_clientid true
cafile /mosquitto/config/pki/ca.crt
certfile /mosquitto/config/pki/server.crt
keyfile /mosquitto/config/pki/server.key
acl_file /mosquitto/config/acl
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_packet_size 66560
message_size_limit 65536
max_inflight_messages 20
max_queued_messages 256
max_queued_bytes 16777216
log_dest stdout
